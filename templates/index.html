<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iris Flower Predictor</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>🌸 Iris Flower Predictor 🌸</h1>
            <p class="subtitle">Enter flower measurements to predict the species</p>

            <form id="iris-form">
                <label for="sepal_length">Sepal Length (cm)</label>
                <input type="number" id="sepal_length" step="0.1" min="0" required>

                <label for="sepal_width">Sepal Width (cm)</label>
                <input type="number" id="sepal_width" step="0.1" min="0" required>

                <label for="petal_length">Petal Length (cm)</label>
                <input type="number" id="petal_length" step="0.1" min="0" required>

                <label for="petal_width">Petal Width (cm)</label>
                <input type="number" id="petal_width" step="0.1" min="0" required>

                <button type="submit">Predict Flower</button>
            </form>

            <div id="result"></div>

            <p class="footer">Model Version: {{ model_version }} | Accuracy: {{ model_accuracy }}%</p>
        </div>
    </div>

    <script src="{{ url_for('static', path='/scripts.js') }}"></script>
</body>
</html>
